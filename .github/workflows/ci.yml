name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Vet and test, plain Go
        run: |
          go version
          go vet ./...
          go test ./...
      - name: Vet and test, GOEXPERIMENT=simd
        if: runner.arch == 'X64' || runner.arch == 'ARM64'
        env:
          GOEXPERIMENT: simd
        run: |
          go vet ./...
          go test ./...
      # Fuzzing and -race (which turns on checkptr, the check of the vector
      # loops' unsafe pointer arithmetic) on arm64 (NEON) and x86 Linux (every
      # kernel the runner's CPU has: GitHub's x86 runners vary, some with
      # AVX-512 VBMI2, some with AVX2 only, so the AVX-512 kernel is also run
      # on our own test hosts); not on Windows, where -race needs cgo and gcc.
      - name: Fuzz the vector paths, GOEXPERIMENT=simd
        if: runner.arch == 'ARM64' || (runner.arch == 'X64' && runner.os == 'Linux')
        env:
          GOEXPERIMENT: simd
        run: go test -run xxx -fuzz FuzzVectorPathsMatchStateMachine -fuzztime 60s .
      - name: Race detector and checkptr, GOEXPERIMENT=simd
        if: runner.arch == 'ARM64' || (runner.arch == 'X64' && runner.os == 'Linux')
        env:
          GOEXPERIMENT: simd
        run: go test -race -count=1 ./...
      # Linux and macOS: rapidyenc's cgo build (the encoder check) and
      # nntp-testkit are not set up for Windows.
      - name: End-to-end tests (e2e module), plain Go
        if: runner.os != 'Windows'
        working-directory: e2e
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: End-to-end tests (e2e module), GOEXPERIMENT=simd
        if: runner.os != 'Windows' && (runner.arch == 'X64' || runner.arch == 'ARM64')
        working-directory: e2e
        env:
          GOEXPERIMENT: simd
        run: go test -count=1 ./...
      - name: End-to-end tests (e2e module), -race, GOEXPERIMENT=simd
        # Reader over real TCP connections, 8 at once, for every kernel
        if: runner.os != 'Windows' && (runner.arch == 'X64' || runner.arch == 'ARM64')
        working-directory: e2e
        env:
          GOEXPERIMENT: simd
        run: go test -race -count=1 ./...
      - name: Benchmark, plain Go
        run: go run ./cmd/yencbench -time 500ms
      - name: Benchmark, GOEXPERIMENT=simd
        if: runner.arch == 'X64' || runner.arch == 'ARM64'
        env:
          GOEXPERIMENT: simd
        run: go run ./cmd/yencbench -time 500ms
