name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Vet and test, plain Go
        run: |
          go version
          go vet ./...
          go test ./...
      - name: Vet and test, GOEXPERIMENT=simd
        if: runner.arch == 'X64'
        env:
          GOEXPERIMENT: simd
        run: |
          go vet ./...
          go test ./...
      - name: Benchmark, plain Go
        run: go run ./cmd/yencbench -time 300ms
      - name: Benchmark, GOEXPERIMENT=simd
        if: runner.arch == 'X64'
        env:
          GOEXPERIMENT: simd
        run: go run ./cmd/yencbench -time 300ms
